name: Mantener Supabase Activo (Keep Alive)

on:
  schedule:
    # Se ejecuta cada 3 días a las 12:00 UTC
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Realizar ping al endpoint de la aplicación
        run: |
          # Si tienes configurado el secreto SITE_URL en GitHub Secrets (ej: https://yuyito-hierbas.vercel.app)
          TARGET_URL="${{ secrets.SITE_URL }}"
          if [ -n "$TARGET_URL" ]; then
            echo "Realizando ping a $TARGET_URL/api/keep-alive..."
            curl -s -f "$TARGET_URL/api/keep-alive" || echo "Fallo el ping al sitio"
          fi
